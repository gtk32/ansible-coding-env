---
- name: Install required packages
  ansible.builtin.dnf:
    name: 
      - vim-enhanced
      - fzf
    state: present
- name: Create configuration directory
  ansible.builtin.file:
    name: ~/.vim
    state: directory
    mode: '0755'
  become: false
- name: Deploy configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  become: false
  loop: "{{ vim_templates }}"
