---
- name: Enable the EPEL repository on RHEL
  block:
    - name: "Enable CodeReady Builder repository for RHEL {{ ansible_facts.distribution_major_version }}"
      community.general.rhsm_repository:
        name: "codeready-builder-for-rhel-{{ ansible_facts.distribution_major_version }}-x86_64-rpms"
        state: enabled
    - name: Import EPEL GPG key
      ansible.builtin.rpm_key:
        key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts.distribution_major_version }}"
        state: present
      become: true
    - name: Install the EPEL RPM package
      ansible.builtin.dnf:
        name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts.distribution_major_version }}.noarch.rpm
        state: present
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - vim-enhanced
      - git
      - fzf
      - nodejs
      - ripgrep
    state: present
- name: Create configuration directory
  ansible.builtin.file:
    name: ~/.vim
    state: directory
    mode: '0755'
  become: false
- name: Deploy configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: '0644'
  become: false
  loop: "{{ vim_templates }}"
