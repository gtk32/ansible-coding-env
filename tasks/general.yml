---
- name: Checks if lazygit is installed
  ansible.builtin.stat:
    path: /usr/bin/lazygit
  register: output
- name: Install lazygit
  when: not output.stat.exists
  block:
    - name: Download and extract tarfile
      ansible.builtin.unarchive:
        dest: /root
        remote_src: true
        src: "{{ lazygit_url }}"
      vars:
        lazygit_url: "{{ base }}/v{{ lazygit_major_version }}.{{ lazygit_minor_version }}.{{ lazygit_patch }}/{{ file }}"
        base: https://github.com/jesseduffield/lazygit/releases/download
        file: lazygit_{{ lazygit_major_version }}.{{ lazygit_minor_version }}.{{ lazygit_patch }}_linux_x86_64.tar.gz
    - name: Copy file to /usr/bin
      ansible.builtin.copy:
        src: /root/lazygit
        dest: /usr/bin
        owner: root
        group: root
        mode: '0755'
        remote_src: true
- name: Install ansible-dev-tools
  block:
    - name: Install python3.12 (RHEL 9 only!)
      ansible.builtin.dnf:
        name: python3.12
        state: present
      when: ansible_facts['distribution_major_version'] | int == 9
    - name: Install pip package manager
      ansible.builtin.dnf:
        name: "{{ pip_package }}"
        state: present
      vars:
        pip_package: "{{ 'python3.12-pip' if ansible_facts['distribution_major_version'] | int == 9 else 'python3-pip' }}"
    - name: Install ansible-dev-tools via pip
      ansible.builtin.pip:
        name: ansible-dev-tools
        executable: pip3.12
        state: present
        extra_args: "--user"
      become: false
- name: Adding usefull aliases in the .bashrc file
  ansible.builtin.lineinfile:
    path: ~/.bashrc
    insertbefore: '^unset rc'
    line: "{{ item }}"
    state: present
  loop:
    - '# Aliases'
    - 'alias la="ls -la"'
    - 'alias lg="lazygit"'
    - 'alias gcb="git branch --show-current"'
    - 'alias gab="git branch --all"'
  become: false
